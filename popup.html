<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --text: #18181b; --muted: #71717a; --line: #e4e4e7; --field: #fafafa;
    --ink: #18181b; --ink-text: #ffffff; --ok: #166534; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --text: #ededef; --muted: #8b8b93; --line: #27272a; --field: #18181b;
            --ink: #ededef; --ink-text: #111113; --ok: #4ade80; --err: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 360px; background: var(--bg); color: var(--text);
         font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }

  header { display: flex; justify-content: space-between; align-items: baseline;
           padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 14px; font-weight: 600; }
  header span { font-size: 11px; color: var(--muted); }

  main { padding: 14px 16px; }
  label { display: block; margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  .row { margin-bottom: 12px; }
  input, textarea { width: 100%; padding: 7px 9px; font: inherit; color: var(--text); background: var(--field);
                    border: 1px solid var(--line); border-radius: 6px; outline: none; }
  input:focus, textarea:focus { border-color: var(--muted); }
  #key, #model { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
  #text { height: 96px; resize: vertical; }

  .key { display: flex; gap: 6px; }
  .key button { flex: none; padding: 0 10px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
                background: none; border: 1px solid var(--line); border-radius: 6px; }
  .key button:hover { color: var(--text); }

  details { margin-bottom: 12px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  #go { width: 100%; padding: 9px; font: inherit; font-weight: 600; cursor: pointer;
        color: var(--ink-text); background: var(--ink); border: 0; border-radius: 6px; }
  #go:hover { opacity: .88; }
  #go:disabled { opacity: .5; cursor: wait; }
  .tip { margin-top: 6px; font-size: 11px; color: var(--muted); text-align: center; }

  #status { margin-top: 10px; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  #status:empty { display: none; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  footer { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>AI Sentence Fixer</h1>
    <span>Sarvam AI</span>
  </header>

  <main>
    <details id="settings">
      <summary>Settings</summary>
      <div class="row">
        <label for="key">API key</label>
        <div class="key">
          <input id="key" type="password" placeholder="sk_..." autocomplete="off">
          <button id="toggleKey" type="button">Show</button>
        </div>
      </div>
      <div class="row">
        <label for="model">Model</label>
        <input id="model" value="sarvam-105b">
      </div>
    </details>

    <div class="row">
      <label for="text">Your thought</label>
      <textarea id="text" placeholder="pls send me report by tmrw i not able to check it today due to meeting" autofocus></textarea>
    </div>
    <button id="go">Fix &amp; insert</button>
    <div class="tip">Ctrl+Enter to run. Click into a text box on the page first.</div>
    <div id="status" role="status"></div>
  </main>

  <footer>Developed by Lakshay</footer>
  <script src="popup.js"></script>
</body>
</html>
